name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (schema paketi + editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # dist/ gitignore'lu; editor paketi dist uzerinden import eder.
      # prepare script'i install'da build eder (frozen-lockfile'li temiz klonda
      # dogrulandi); bu acik adim, prepare'in kosmadigi kosullara (ignore-scripts,
      # cache/tooling degisikligi, elle temizlenmis dist) karsi emniyet kemeridir.
      # dist YOKKEN editor paketinin vitest'i daha import/toplama asamasinda topluca
      # kirilir (sema paketi kendi testlerini src'den kostugu icin ayakta kalir).
      # Kirilan test SAYISI yorumda bilerek yok: sayi paketle birlikte buyur ve
      # dogrulanamadan bayatlar; ustelik vitest toplanamayan dosyanin testlerini
      # sayamaz, yani "N test kirilir" aracin ciktisinda tanimli bir buyukluk bile
      # degildir (olcum kaydi: "borc B4" commit mesaji).
      - name: Build timeline-schema
        run: pnpm --filter @videoedit/timeline-schema build

      - name: Test (tum workspace)
        run: pnpm -r test

      - name: Typecheck editor
        run: pnpm --filter @videoedit/editor exec tsc -b

      # E2E testleri uygulamanin tsconfig'ine DAHIL DEGIL (include: ['src']) —
      # Playwright tipleri src derlemesine sizmasin diye ayri proje.
      - name: Typecheck editor E2E
        run: pnpm --filter @videoedit/editor test:e2e:typecheck

      # TESLIM EDILEN ARTEFAKT. M4 denetimi (yuksek): `vite build` CI'da hicbir
      # adimda calismiyordu (grep = 0). E2E bilincli olarak DEV sunucusuna
      # baglanir (bkz. e2e job'undaki gerekce), dolayisiyla production
      # derlemesini kiran bir degisiklik — kaldirilmis bir dinamik import,
      # `import.meta.env.DEV` disinda kalan bir test kancasi, rollup'in
      # cozemedigi bir alias — TUM CI yesilken kullaniciya bozuk gidebilirdi.
      # `build` script'i `tsc -b && vite build`: tsc adimi zaten yukarida
      # kosuyor (incremental, saniyeler), asil deger vite/rollup asamasi.
      - name: Build editor (teslim edilen production artefakti)
        run: pnpm --filter @videoedit/editor build

      # Uretilmis artefakt drift kontrolu: schema.json + test vektorleri
      # commit'lenmis halleriyle birebir ayni olmali.
      - name: Schema drift kontrolu
        run: |
          pnpm --filter @videoedit/timeline-schema generate
          git diff --exit-code -- packages/timeline-schema/generated

  dotnet:
    name: .NET (backend)
    # Bilincli olarak node job'ina BAGIMLI DEGIL: SchemaGen commit'li
    # packages/timeline-schema/generated/schema.json'u kullanir.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # [FfmpegFact]/[MinioAndFfmpegFact] testleri icin — yoksa Skip olurlar,
      # kuruluyken gercekten kosarlar.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # MinIO: [MinioFact]/[MinioAndFfmpegFact] testleri CI'da GERCEK kossun.
      # GitHub `services:` blogu imaj komutunu override EDEMEZ ve resmi
      # minio/minio imaji `server /data` komutu ister (bitnami/minio artik
      # yayinlanmiyor) — bu yuzden docker run adimi kullanilir. Imaj +
      # kimlik bilgileri + healthcheck compose.dev.yml ile birebir ayni.
      # Bucket on-olusturma GEREKMEZ: testler kendi bucket'larini
      # EnsureBucketsExistAsync ile olusturur (MinioStorageSmokeTests gibi).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=videoedit \
            -e MINIO_ROOT_PASSWORD=devpassword123 \
            --health-cmd "mc ready local" \
            --health-interval 5s --health-timeout 3s --health-retries 20 \
            minio/minio:latest server /data
          echo "MinIO health bekleniyor..."
          timeout 90 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" minio)" = "healthy" ]; do sleep 2; done'
          docker inspect -f '{{.State.Health.Status}}' minio

      - name: Build
        run: dotnet build backend/VideoEdit.sln

      - name: Test
        run: dotnet test backend/VideoEdit.sln --no-build
        env:
          # MinIO service container ayakta -> [MinioFact] testleri kosar.
          MINIO_AVAILABLE: "1"

      # Golden/snapshot drift kontrolu: testler golden PNG ya da export snapshot'i yeniden
      # uretip DEGISTIRDIYSE commit'li hali bayat demektir -> CI kirmizi (uretilen fark
      # incelemeden merge edilemez; degisiklik bilincliyse dosyalar commit'lenir).
      # RasterGoldens da listede (13. tur, BG-3): RasterAssert.MatchesGolden golden dosyasi
      # yoksa File.Copy ile uretip GECER — dizin taranmazsa kaybolan/yeniden uretilen shape
      # golden'i CI'da hicbir iz birakmadan kendini yazardi.
      - name: Golden/snapshot drift kontrolu
        run: |
          PATHS="backend/tests/GoldenFrames backend/tests/RasterGoldens backend/tests/VideoEdit.UnitTests/ExportSnapshots"
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            echo "::error::Golden/snapshot drift tespit edildi:"
            git status --porcelain -- $PATHS
            git diff -- $PATHS
            exit 1
          fi

      # Uretilmis C# kontratlarinin drift kontrolu.
      - name: Contracts drift kontrolu
        run: |
          dotnet run --project backend/tools/SchemaGen
          git diff --exit-code -- backend/src/VideoEdit.Contracts/Generated

  e2e:
    name: E2E (Playwright — gercek fare)
    # Bilincli olarak node/dotnet job'larina BAGIMLI DEGIL: paralel kossun.
    # continue-on-error YOK — bu job kirmiziysa CI kirmizidir; kullanicinin
    # "kirpma/tasima/sag tik calismiyor" sikayetini yakalayan tek katman bu.
    runs-on: ubuntu-latest
    # 25 -> 55: artik GERCEK medya uretiliyor (ffmpeg), Worker derlenip
    # calisiyor ve testler uctan uca transcode + export render yapiyor.
    # Yerel suite suresi/test sayisi yorumda bilerek YOK: paketle birlikte
    # buyur ve dogrulanamadan bayatlar (borc B4 deseni); guncel olcum
    # docs/SKILLS.md "playwright-tam-suite" girdisinde. CI runner'i yavas +
    # Worker/API derlemesi + `playwright install` payi ile 55 dk pay birakir.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # [M4 denetim / YUKSEK] ffmpeg CI'da YOKTU -> E2E'nin en degerli testleri
      # (media-upload, export-flow, player'in gercek medya testi) her kosuda
      # `test.skip(ffmpegVersion() === null, ...)` ile ATLANIYORDU: CI yesildi
      # ama medya hattinin TEK ucdan uca kaniti hic kosmamisti.
      # Iki ayri tuketicisi var:
      #   1. e2e/support/media.ts — test videosunu `ffmpeg -f lavfi testsrc2` ile
      #      KOSUM SIRASINDA uretir (repo'da ikili dosya yok),
      #   2. VideoEdit.Worker — Program.cs'teki EnsureMediaToolAvailable boot
      #      kontrolu ffmpeg/ffprobe yoksa worker'i HIC ayaga kaldirmaz.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install (node)
        run: pnpm install --frozen-lockfile

      # dist/ gitignore'lu; editor paketi timeline-schema'yi dist uzerinden import eder.
      - name: Build timeline-schema
        run: pnpm --filter @videoedit/timeline-schema build

      # Gereken altyapi:
      # - postgres: auth + proje + timeline + Hangfire storage.
      # - minio   : ARTIK ZORUNLU. Tarayici part'lari dogrudan MinIO'ya PUT eder
      #             (presigned URL; compose.dev.yml'deki MINIO_API_CORS_ALLOW_ORIGIN
      #             = http://localhost:5173 tam da bunun icin) ve Worker orijinali
      #             oradan indirip proxy/filmstrip/export ciktisini oraya yazar.
      # - redis   : BU JOB'DA BASLATILMIYOR — ve bu artik bir ACIK SORUDUR.
      #             Yorumun eski hali "kod tabaninda tek tuketicisi yok" diyordu;
      #             2026-08-31 SignalR ilerleme kanalindan beri YANLIS: worker
      #             Redis `job-progress` kanalina publish eder, API'deki
      #             RedisProgressForwarder dinler. Redis'siz API/Worker yine
      #             acilir ve polling yedegi tasir (Hangfire storage = PostgreSQL),
      #             AMA hub'i olcen spec'ler (or. export-progress-hub) Redis'in
      #             ayakta olmasini bekler. Bu adima redis eklemek bir CI davranis
      #             degisikligidir ve dokuman-senkron diliminde bilerek yapilmadi;
      #             kayit: docs/STATE.md "Bilinen sorunlar".
      - name: Altyapi servisleri (postgres + minio)
        run: docker compose -f compose.dev.yml up -d postgres minio

      - name: Postgres hazir olsun
        run: |
          timeout 120 sh -c 'until docker compose -f compose.dev.yml exec -T postgres pg_isready -U app -d videoedit; do sleep 2; done'

      # MinIO'nun healthcheck'i (mc ready local) yesillenmeden API acilista
      # bucket'lari olusturamaz ve ilk yukleme 5xx alirdi. Eskiden beklenmiyordu
      # cunku hicbir test gercekten yukleme yapmiyordu; artik yapiyor.
      - name: MinIO hazir olsun
        run: |
          timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" $(docker compose -f compose.dev.yml ps -q minio))" = "healthy" ]; do sleep 2; done'
          echo "MinIO healthy."

      - name: Veritabani migrasyonlari
        run: dotnet run --project backend/src/VideoEdit.Api --no-launch-profile -- --migrate-only
        env:
          ASPNETCORE_ENVIRONMENT: Development

      # Arka planda API. --no-launch-profile: launchSettings yerine acik env
      # (CI'da profil cozumlemesine guvenmeyiz).
      - name: API'yi baslat (http://localhost:5000)
        run: |
          dotnet run --project backend/src/VideoEdit.Api --no-launch-profile > api.log 2>&1 &
          timeout 120 sh -c 'until curl -sf http://localhost:5000/health > /dev/null; do sleep 2; done'
          echo "API hazir."
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000

      # [M4 denetim / YUKSEK] Worker CI'da HIC baslatilmiyordu. API yalniz
      # Hangfire CLIENT'idir (Api/Program.cs: AddHangfire, AddHangfireServer YOK)
      # — isi alacak kimse olmadigindan asset "Sirada"da kalir ve
      # e2e/support/library.ts `waitForReady` 60 sn sonra WORKER_DOWN_MESSAGE ile
      # ATLAR. Yani media-upload ve export-flow CI'da garantili skip'ti.
      #
      # DOTNET_ENVIRONMENT (ASPNETCORE_ degil): generic host ortami bundan okur
      # (bkz. Worker/Program.cs basindaki not) — yanlis degiskenle Production
      # sanip prod guard'larindan duserdi.
      - name: "Worker'i baslat (Hangfire kuyruklari: transcode + export)"
        run: |
          dotnet run --project backend/src/VideoEdit.Worker --no-launch-profile > worker.log 2>&1 &
          echo $! > worker.pid
          # HAZIRLIK SINYALI: "surec ayakta" YETMEZ — ffmpeg/ffprobe boot
          # kontrolu ya da Postgres baglantisi patlarsa surec saniyeler icinde
          # oluyor. Worker ayaga kalktiginda Hangfire'a IKI server kaydeder
          # (transcode + export, Worker/Program.cs'te iki AddHangfireServer);
          # hangfire.server tablosundaki satir sayisi bu yuzden dogru sinyaldir
          # (API server kaydetmedigi icin bu satirlar YALNIZ worker'indir).
          ready=0
          for _ in $(seq 1 90); do
            if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
              echo "::error::Worker sureci oldu (bkz. asagidaki log)."
              cat worker.log
              exit 1
            fi
            n=$(docker compose -f compose.dev.yml exec -T postgres \
                  psql -U app -d videoedit -tAc 'select count(*) from hangfire.server' \
                  2>/dev/null | tr -d '[:space:]')
            if [ "${n:-0}" -ge 2 ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Worker 180 sn icinde Hangfire'a kaydolmadi."
            cat worker.log
            exit 1
          fi
          echo "Worker hazir (Hangfire server kaydi: $n)."
        env:
          DOTNET_ENVIRONMENT: Development

      # DEV sunucusu (preview degil) — BILINCLI ve KORUNAN bir karar:
      #
      # E2E, jestin SONUCUNU dogrulamak icin store'lari okur (canvas timeline'in
      # secili klip / zoom / scroll durumu icin DOM'da okunabilir gosterge yok).
      # Kopru iki yoldan kurulur (e2e/support/appBridge.ts):
      #   1. `window.__videoeditTest` — uygulamanin DEV-only test kancasi
      #      (src/state/testBridge.ts, `import.meta.env.DEV` guard'li; production
      #      bundle'inda kod olarak BULUNMAZ).
      #   2. Vite dev modul grafigi (`import('/src/state/docStore.ts?t=...')`).
      # Her ikisi de dev sunucusuna baglidir. Production preview'da modul
      # yollari hash'lenir, test kancasi da derlenmez -> kopru kurulamaz.
      #
      # Bu, "test edilen sey teslim edilen sey degil" riskini tasir; risk
      # node job'undaki `Build editor (teslim edilen production artefakti)`
      # adimiyla karsilanir: production derlemesi her PR'da GERCEKTEN uretilir.
      # Etkilesim kanitinin kendisi (gercek fare/klavye) dev/prod'dan bagimsizdir.
      - name: Vite dev sunucusunu baslat (http://localhost:5173)
        run: |
          pnpm --filter @videoedit/editor exec vite --port 5173 --strictPort > vite.log 2>&1 &
          timeout 120 sh -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 2; done'
          echo "Vite hazir."

      - name: Playwright chromium
        run: pnpm --filter @videoedit/editor exec playwright install --with-deps chromium

      # `test:e2e` yerine acik `playwright test`: config'in CI reporter listesine
      # (list + html) e2e/support/ciSkipGuard.ts EKLENIR. --reporter CLI bayragi
      # config'i TAMAMEN gecersiz kilar, bu yuzden list/html burada yeniden
      # yazilir; html'in cikti klasoru env ile config'teki degerde tutulur
      # (artefakt yukleme adimi o yolu bekliyor).
      #
      # ciSkipGuard NE ISE YARAR: bir testin `test.skip(...)` ile atlanmasi CI'da
      # SESSIZ YESIL uretir — bu is diliminin kok bulgusu tam olarak buydu
      # (ffmpeg yok + worker yok = en degerli iki test hic kosmadi, CI yesildi).
      # Guard, CI'da atlanan TEK bir test bile varsa kosumu KIRMIZI yapar ve
      # atlama gerekcesini basar. Skip yollari kodda KALIR (yerel gelistirici
      # ffmpeg'siz calisabilsin diye) ama CI'da bir daha saklanamazlar.
      - name: E2E kos
        run: >
          pnpm --filter @videoedit/editor exec playwright test
          --reporter=list,html,./e2e/support/ciSkipGuard.ts
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/.artifacts/report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Sunucu loglari (yalniz hata durumunda)
        if: failure()
        run: |
          echo "----- API -----"; tail -n 200 api.log || true
          echo "----- WORKER -----"; tail -n 200 worker.log || true
          echo "----- VITE -----"; tail -n 200 vite.log || true

      - name: Playwright trace/rapor artefaktlari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: apps/editor/e2e/.artifacts/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [Api, Worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.project }} image
        run: docker build -f backend/src/VideoEdit.${{ matrix.project }}/Dockerfile backend
